name: Deploy AWS backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Deploy SAM stack
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build and deploy
        working-directory: backend
        run: sam build --template-file template.yaml && sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --template-file .aws-sam/build/template.yaml --stack-name team-hub --capabilities CAPABILITY_IAM --resolve-s3 --region eu-central-1 --parameter-overrides "GoogleClientId=${{ secrets.GOOGLE_CLIENT_ID }}" "AdminEmails=${{ secrets.ADMIN_EMAILS }}" "HrSheetIds=${{ secrets.HR_SHEET_IDS }}" "SessionSecret=${{ secrets.SESSION_SECRET }}" "GoogleServiceAccountJson=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" "SesFromEmail=noreply@sofiasummit.bg" "FrontendUrl=https://krasen2000kstanev-hub.github.io/RUSHTEAM/"
