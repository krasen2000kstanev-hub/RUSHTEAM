AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Team Hub serverless API

Parameters:
  AllowedOrigins:
    Type: String
    Default: https://krasen2000kstanev-hub.github.io
  GoogleClientId:
    Type: String
    NoEcho: true
  AdminEmails:
    Type: String
  HrSheetIds:
    Type: String
  SessionSecret:
    Type: String
    NoEcho: true
  GoogleServiceAccountJson:
    Type: String
    NoEcho: true
  SesFromEmail:
    Type: String
    Default: noreply@sofiasummit.bg
  FrontendUrl:
    Type: String
    Default: https://krasen2000kstanev-hub.github.io/RUSHTEAM/
  ReportRecipients:
    Type: String
    Default: krasen2000.k.stanev@gmail.com,cnikolov95@gmail.com
  HourlyRatesJson:
    Type: String
    NoEcho: true
    Default: '{}'

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref TeamHubTable
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        GOOGLE_CLIENT_ID: !Ref GoogleClientId
        ADMIN_EMAILS: !Ref AdminEmails
        HR_SHEET_IDS: !Ref HrSheetIds
        SESSION_SECRET: !Ref SessionSecret
        GOOGLE_SERVICE_ACCOUNT_JSON: !Ref GoogleServiceAccountJson
        SES_FROM_EMAIL: !Ref SesFromEmail
        FRONTEND_URL: !Ref FrontendUrl
        REPORT_RECIPIENTS: !Ref ReportRecipients
        HOURLY_RATES_JSON: !Ref HourlyRatesJson

Resources:
  TeamHubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/index.handler
      Environment:
        Variables:
          NOTIFIER_FUNCTION_NAME: !Ref NotificationFunction
          AUDIT_TABLE: !Ref AuditTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TeamHubTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - LambdaInvokePolicy:
            FunctionName: !Ref NotificationFunction
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref TeamHubApi
            Path: /{proxy+}
            Method: ANY

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/notify.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TeamHubTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'

  MonthlyReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/monthly.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TeamHubTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'

  MonthlyReportScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeMonthlyReport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: [!GetAtt MonthlyReportFunction.Arn, !GetAtt DailyDigestFunction.Arn]

  DailyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/monthly.daily
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TeamHubTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'

  DailyDigestSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(30 8 ? * MON-FRI *)
      ScheduleExpressionTimezone: Europe/Sofia
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt DailyDigestFunction.Arn
        RoleArn: !GetAtt MonthlyReportScheduleRole.Arn

  MonthlyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(0 9 1 * ? *)
      ScheduleExpressionTimezone: Europe/Sofia
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt MonthlyReportFunction.Arn
        RoleArn: !GetAtt MonthlyReportScheduleRole.Arn

  TeamHubTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: CollectionIndex
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # История кой какво е правил. Без TTL: записите се пазят без срок (изискване: поне 2 години).
  # Retain: таблицата остава дори ако stack-ът бъде изтрит.
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${TeamHubApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref TeamHubTable
  NotificationFunctionName:
    Value: !Ref NotificationFunction
