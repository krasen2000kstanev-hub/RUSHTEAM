# Само за локална разработка и тестове. Никога не се deploy-ва.
name = "team-hub-api-test"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:8765"
GOOGLE_CLIENT_ID = "test.apps.googleusercontent.com"
ADMIN_EMAILS = "admin@example.test"
HR_SHEET_IDS = "sheet-a,sheet-b"
SESSION_SECRET = "local-test-secret-not-for-production"
ALLOW_TEST_LOGIN = "1"

[[d1_databases]]
binding = "DB"
database_name = "team-hub"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
